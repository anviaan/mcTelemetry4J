spring.application.name=mcTelemetry4J

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mc_telemetry}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

spring.flyway.locations=classpath:db/migration

server.tomcat.threads.max=400
server.tomcat.accept-count=200
server.tomcat.max-connections=10000

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

logging.level.org.hibernate=ERROR

api.password=${API_PASSWORD:password}
api.username=${API_USERNAME:admin}

rate-limit.trusted-proxy-addresses=${RATE_LIMIT_TRUSTED_PROXY_ADDRESSES:}

springdoc.api-docs.path=/api-docs
