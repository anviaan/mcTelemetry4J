name: McTelemetry4J

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: telemetry_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - telemetry_backend
    networks:
      telemetry_network:
        ipv4_address: 172.30.0.2

  telemetry_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry_backend
    restart: unless-stopped
    depends_on:
      telemetry_db:
        condition: service_healthy
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:8080:8080"
    environment:
      DB_HOST: telemetry_db
      DB_PORT: 5432
      DB_NAME: mc_telemetry
      DB_USERNAME: mc_user
      DB_PASSWORD: ${DB_PASSWORD}
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD: ${API_PASSWORD}
      RATE_LIMIT_TRUSTED_PROXY_ADDRESSES: ${RATE_LIMIT_TRUSTED_PROXY_ADDRESSES:-172.30.0.2}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/telemetry/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - telemetry_network

  telemetry_db:
    image: postgres:16-alpine
    container_name: telemetry_db
    restart: unless-stopped
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:5433:5432"
    environment:
      POSTGRES_DB: mc_telemetry
      POSTGRES_USER: mc_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_user -d mc_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - telemetry_network

volumes:
  pg_data:

networks:
  telemetry_network:
    ipam:
      config:
        - subnet: 172.30.0.0/24
